[project]
name = "memory-boost"
version = "0.1.1"
description = "Memory that reviews itself: a markdown wiki for coding agents over MCP, plus drift reports on the wiki and digests of your own sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Arnau González" }]
keywords = ["mcp", "memory", "claude-code", "codex", "ai-agents", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
memory-boost = "memory_boost.cli:main"

[project.urls]
Repository = "https://github.com/arnaugonzalez/memory-boost"
Issues = "https://github.com/arnaugonzalez/memory-boost/issues"
Changelog = "https://github.com/arnaugonzalez/memory-boost/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_boost"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:memory_boost.*"]
